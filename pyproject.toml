[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-quant"
version = "0.1.0"
description = "Safety-classification robustness under aggressive LLM quantization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
eval = [
    "accelerate==0.34.2",
    "datasets==2.20.0",
    "sentencepiece",
    "torch>=2",
    "tqdm>=4",
    "transformers==4.44.2",
]
general-eval = [
    "lm-eval==0.4.8",
    "peft==0.13.2",
]
api-judge = ["openai>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
